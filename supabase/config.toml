project_id = "kschuwekbrrwmhzinsrv"

[functions.gmail-oauth-callback]
verify_jwt = false

# O navegador volta do Instagram direto para cá (é o `redirect_uri` montado em
# instagram-oauth-start), e nessa volta não existe JWT. Sem esta exceção a
# plataforma devolvia 401 antes do handler rodar: a troca do code por token e a
# assinatura do webhook nunca aconteciam, e conectar o Instagram sempre falhava
# logo depois de o usuário autorizar. A proteção real é o parâmetro `state`.
[functions.instagram-oauth-callback]
verify_jwt = false

[functions.lead-capture]
verify_jwt = false

# Rastreio de abertura/clique — acessado pelo e-mail do destinatário, sem JWT
[functions.email-track]
verify_jwt = false

# A Meta não envia JWT nas chamadas de webhook. Sem isto, a plataforma devolve
# 401 antes de o código rodar, e o webhook fica inalcançável para ela.
# A proteção real é a assinatura HMAC (X-Hub-Signature-256), verificada no
# código — e agora com falha fechada quando META_APP_SECRET não existe.
[functions.whatsapp-webhook]
verify_jwt = false

# Mesmo caso do WhatsApp: a Meta também não envia JWT no webhook do Instagram.
# Faltando aqui, a plataforma devolvia 401 e a verificação HMAC do código nunca
# chegava a rodar — as DMs recebidas eram descartadas em silêncio.
[functions.instagram-webhook]
verify_jwt = false

# O cliente abre o orçamento sem ter conta no CRM. A função devolve só os campos
# que ele pode ver — a tabela segue fechada por RLS.
[functions.orcamento-publico]
verify_jwt = false
