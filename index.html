<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIONEX — CRM para o comercial da saúde</title>
    <meta name="description" content="Do primeiro contato ao fechamento: leads, contatos, negócios e atendimento por WhatsApp, Instagram e e-mail — num lugar só.">
    <link rel="icon" type="image/png" href="/favicon.png">

    <!--
      Tema aplicado ANTES do primeiro paint.

      O <html> vinha com class="dark" cravada e o main.tsx apenas ADICIONAVA a
      classe salva, sem remover -- então com tema claro o documento ficava com
      "dark" e "light" ao mesmo tempo, e a página renderizava escura até o React
      montar e o ThemeContext limpar as duas.

      Este script roda de forma síncrona no <head>, antes de qualquer pixel, e é
      a única forma de não piscar. Fica inline de propósito: um arquivo externo
      já chegaria tarde demais.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("fc-theme") || "light";
          var escuro =
            salvo === "dark" ||
            (salvo === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(escuro ? "dark" : "light");
        } catch (e) {
          // Navegador com armazenamento bloqueado: cai no claro, que é o padrão.
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Só os pesos que o código realmente usa.
      
      Eram 12 pedidos e 8 usados. Fora: Nunito 300 (zero font-light no projeto),
      Poppins 400 e 500 (os 12 usos de font-heading resolvem em 600 ou 700, e
      h1-h4 herdam bold do navegador) e JetBrains 600 (nenhum font-mono em
      semibold). Quatro arquivos woff2 a menos por visita fria.
      
      Importa mais do que o tamanho: este <link> é BLOQUEANTE de renderização,
      então cada peso a menos é uma requisição a menos no caminho crítico.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


    <!--
      PRÉVIA DO LINK (Open Graph).

      A imagem daqui era um URL de PREVIEW DO LOVABLE, num R2 de terceiros:
      um screenshot antigo do app, hospedado fora do nosso controle, com o id do
      projeto do andaime exposto na URL. Era isso que aparecia ao compartilhar o
      link -- a "foto antiga".

      Agora é `/og-vionex.png`, servida pelo próprio domínio, gerada a partir de
      `scripts/og-imagem.html` com a marca e as cores reais do projeto.

      DUAS COISAS QUE PARECEM DETALHE E NÃO SÃO:

      1. URL ABSOLUTA, sempre. WhatsApp, Slack e iMessage buscam a imagem de
         fora do navegador da pessoa -- caminho relativo não resolve para eles, e
         a prévia sai sem imagem.
      2. TROCAR O NOME DO ARQUIVO ao trocar a imagem. Essas plataformas guardam
         a prévia em cache POR URL, por semanas. Sobrescrever `og-vionex.png`
         mantém a imagem velha aparecendo; publicar `og-vionex-2.png` é o que faz
         a nova valer. É por isso que a de agora tem nome novo em vez de
         reaproveitar o antigo.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VIONEX" />
    <meta property="og:url" content="https://crmvionex.vercel.app/" />
    <meta property="og:image" content="https://crmvionex.vercel.app/og-vionex.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="VIONEX — do primeiro contato ao fechamento">
    <meta name="twitter:image" content="https://crmvionex.vercel.app/og-vionex.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:title" content="VIONEX — CRM para o comercial da saúde">
    <meta name="twitter:title" content="VIONEX — CRM para o comercial da saúde">
    <meta property="og:description" content="Do primeiro contato ao fechamento: leads, contatos, negócios e atendimento por WhatsApp, Instagram e e-mail — num lugar só.">
    <meta name="twitter:description" content="Do primeiro contato ao fechamento: leads, contatos, negócios e atendimento por WhatsApp, Instagram e e-mail — num lugar só.">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
